services:
  app:
    image: aanabdulrohman/laravel-todolist:${IMAGE_TAG:-1.0.0}
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env
      - sqlite_data:/var/www/html/database
      - laravel_storage:/var/www/html/storage
    networks:
      - laravel_network

  webserver:
    image: nginx:alpine
    container_name: laravel_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  laravel_storage:
  sqlite_data: