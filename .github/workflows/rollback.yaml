name: Rollback Deployment (by Version Tag)

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Tag versi tujuan rollback (Contoh: 1.0.0, 1.0.1)'
        required: true
        type: string
        default: '1.0.0'

jobs:
  rollback:
    name: Rollback to Version ${{ inputs.target_version }}
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject .env File from GitHub Secrets
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull & Deploy Target Version
        run: |
          export IMAGE_TAG=${{ inputs.target_version }}
          docker compose pull app
          docker compose down
          docker compose up -d

      - name: Reset Cache
        run: |
          docker compose exec -T app php artisan config:clear
          docker compose exec -T app php artisan route:clear
      
      - name: Clear All Laravel Optimization Caches
        run: |
          docker compose exec -T app php artisan optimize:clear