name: CI/CD Pipeline - Laravel Docker Deployment

on:
  push:
    tags:
      - '*.*.*'   # Trigger jika push tag seperti 1.0.1, 1.0.2

jobs:
  # JOB 1: Build & Push Image ke Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Automatic Tagging)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/laravel-todolist
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # JOB 2: Deploy ke Local Runner
  deploy-local:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject .env File from GitHub Secrets
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull Latest Docker Image
        run: |
          # Dapatkan tag versi dari git ref_name (misal 1.0.1) atau default ke latest
          export IMAGE_TAG=${GITHUB_REF_NAME#v}
          docker compose pull app

      - name: Restart Containers
        run: |
          export IMAGE_TAG=${GITHUB_REF_NAME#v}
          docker compose down
          docker compose up -d

      - name: Fix Permissions & Ensure SQLite Exists
        run: |
          docker compose exec -T -u root app touch /var/www/html/database/database.sqlite
          docker compose exec -T -u root app chown -R www-data:www-data /var/www/html/database /var/www/html/storage
          docker compose exec -T -u root app chmod -R 775 /var/www/html/database /var/www/html/storage

      - name: Run Database Migrations & Clear Cache
        run: |
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan config:clear
          docker compose exec -T app php artisan route:clear